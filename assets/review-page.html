<title>__PROJECT__Cut Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a three-pane edit suite. Cut library | viewer and transport | notes for the version on screen.
   Deliberately single-theme dark: a neutral grey surround keeps colour judgement honest on the footage.
   Under 900px it stacks: cut picker, viewer, version bar, composer, notes. */
:root{
  --ground:#151619;
  --panel:#1c1d21;
  --raised:#26282d;
  --line:#33353b;
  --text:#ecebe7;
  --muted:#9d9c97;
  --faint:#6d6d6a;
  --accent:__ACCENT__;
  --accent-ink:__ACCENT_INK__;
  --ok:#62c08f;
  --ok-ink:#0f2419;
  --warn:#e2a54a;
  --danger:#ea6a5f;
  --claude:#d08a6a;
  --ui:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:244px minmax(0,1fr) 400px;height:100%}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);padding:7px 12px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(.94)}
.btn.good{background:var(--ok);color:var(--ok-ink);border-color:var(--ok);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.chip.claude{color:var(--claude);border-color:color-mix(in srgb,var(--claude) 45%,transparent)}
.chip.solid-ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}

/* ---------- library ---------- */
.library{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:700;letter-spacing:.14em;font-size:13px}
.brand span{color:var(--muted);font-size:13px}
#cutList{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:3px}
.group-head{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.group-head h3{margin:0;flex:1;min-width:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.cut{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:7px 10px}
.cut:hover{background:var(--raised)}
.cut[aria-current="true"]{background:var(--raised);border-color:var(--line)}
.cut[aria-current="true"] .cut-name::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.cut.old{padding-left:22px}
.cut.old .cut-name{font-weight:400;color:var(--muted)}
.cut-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cut-meta{color:var(--faint);font-size:12px}
.cut-side{display:flex;align-items:center;gap:5px}
.count{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--text);font-size:11px;text-align:center}
.count.has{background:var(--accent);color:var(--accent-ink);font-weight:600}
.fold{align-self:flex-start;margin-left:14px}
.lib-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.upload{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground)}
.upload label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.upload .row{display:flex;gap:8px}
.upload .row>*{flex:1;min-width:0}
.status{font-size:12px;color:var(--muted);min-height:1em}
.status.err{color:var(--danger)}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage-head{display:flex;align-items:center;gap:10px;padding-block:12px;padding-inline:20px;border-bottom:1px solid var(--line);min-height:56px}
.stage-title{min-width:0;flex:1}
.stage-title .g{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stage-title h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cut-picker{display:none}
.seg{display:none;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.player-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:18px;position:relative}
.frame{position:relative;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line);width:270px;height:480px;max-width:100%;flex:none}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.frame .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.66);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;pointer-events:none}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frame.pen #ink{pointer-events:auto;cursor:crosshair;touch-action:none}
.frame.pen{box-shadow:0 0 0 2px var(--accent)}
.pen-flag{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;pointer-events:none}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--ground);z-index:2}
.stage-empty p{max-width:34ch;margin:0}
.stage-empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

.transport{padding-block:10px 14px;padding-inline:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.scrub{position:relative;height:34px;cursor:pointer;touch-action:none;user-select:none}
.track{position:absolute;left:0;right:0;top:6px;height:6px;border-radius:3px;background:var(--raised)}
.track .buf{position:absolute;inset:0 auto 0 0;background:var(--line);border-radius:3px}
.track .prog{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:3px}
.track .sel{position:absolute;top:-3px;bottom:-3px;background:color-mix(in srgb,var(--accent) 28%,transparent);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.playhead{position:absolute;top:0;height:18px;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none}
.playhead::after{content:"";position:absolute;top:-2px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.lane{position:absolute;left:0;right:0;top:20px;height:12px}
.mk{position:absolute;top:0;height:10px;min-width:10px;margin-left:-5px;border-radius:5px;background:var(--accent);border:0;padding:0;box-shadow:0 0 0 2px var(--ground)}
.mk.range{margin-left:0;border-radius:3px}
.mk.addressed{background:var(--claude)}
.mk.done{background:var(--faint)}
.mk.fix{background:transparent;box-shadow:inset 0 0 0 2px var(--claude)}
.mk.sel{box-shadow:0 0 0 2px var(--text)}
.hover-tip{position:absolute;bottom:38px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;pointer-events:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;z-index:3}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--text)}
.icon-btn:hover{background:var(--raised)}
.icon-btn.play{background:var(--text);color:var(--ground)}
.icon-btn.play:hover{background:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.clock{font-size:13px;padding-inline:8px;color:var(--muted)}
.clock b{color:var(--text);font-weight:500}
.speed{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px}
.b-row{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px dashed var(--line)}
.b-row .field{width:auto;max-width:170px;padding:4px 6px;font-size:12px}
.b-scrub{position:relative;flex:1;height:18px;cursor:pointer;touch-action:none;min-width:60px}
.b-scrub .track{top:6px}
.b-scrub .prog{background:var(--muted)}

/* ---------- notes column ---------- */
.notes{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.verbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.verbar .what{flex:1;min-width:120px;font-size:12.5px;color:var(--muted)}
.verbar .what b{color:var(--text);font-weight:600}
.round{margin:10px 16px 0;padding:10px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.round.claude{background:color-mix(in srgb,var(--claude) 9%,var(--panel));border-color:color-mix(in srgb,var(--claude) 36%,transparent)}
.round b{font-weight:600}
.round .msg{font-family:var(--mono);font-size:11.5px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere;user-select:all}
.round .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.composer{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.compose-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-pill{font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 8px;font-weight:500;border:0;white-space:nowrap}
.tc-pill.quiet{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.tc-pill.whole{background:var(--text);color:var(--ground)}
.compose-hint{color:var(--faint);font-size:12px}
textarea.note-input{resize:vertical;min-height:56px;max-height:240px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;line-height:1.45;width:100%;box-sizing:border-box}
textarea.note-input:focus{border-color:var(--faint);outline:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools .btn{padding:6px 10px;font-size:12px}
.only{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.keys{display:flex;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:11.5px}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--raised);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.readonly{color:var(--muted);font-size:13px;margin:0}

.notes-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.tab{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--raised);color:var(--text)}
.tab .n{font-family:var(--mono);margin-left:4px;color:var(--faint)}
.tab .n.hot{color:var(--accent)}
.filter{width:auto;padding:4px 6px;font-size:12px}
.note-list{list-style:none;margin:0;padding:6px 8px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.sec{padding:12px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec .n{font-family:var(--mono);color:var(--faint);letter-spacing:0}
.sec button{margin-left:auto;text-transform:none;letter-spacing:0}
.note{border-radius:var(--r);padding:10px 10px 8px;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.note:hover{background:var(--raised)}
.note.active{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.note.selected{border-color:var(--faint);background:var(--raised)}
.note.done .note-text{color:var(--muted)}
.note.done .tc-pill,.note.addressed .tc-pill{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.note-head{display:flex;align-items:center;gap:8px;min-width:0}
.num{font-family:var(--mono);color:var(--faint);font-size:11px;min-width:22px;flex:none}
.who{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.who img,.who .ini{width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover}
.who .ini{display:grid;place-items:center;background:var(--line);font-size:10px;font-weight:600}
.who .ini.c{background:var(--claude);color:#1d120c}
.who .nm{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ago{color:var(--faint);font-size:12px;white-space:nowrap}
.check{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;flex:none;padding:0}
.check svg{width:13px;height:13px;fill:none;stroke:transparent;stroke-width:2.4}
.check:hover{border-color:var(--ok)}
.check:hover svg{stroke:var(--ok)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{stroke:var(--ok-ink)}
.check.sq{border-radius:6px}
.note-text{margin:0;padding-left:30px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-meta{display:flex;align-items:center;gap:4px;padding-left:26px;flex-wrap:wrap}
.note-meta .btn{padding:2px 6px;font-size:12px}
.note-meta .chip{margin-left:4px}
.replies{list-style:none;margin:2px 0 0 30px;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.reply.from-claude{border-left:0}
.replies:has(.from-claude){border-left-color:color-mix(in srgb,var(--claude) 55%,transparent)}
.reply .who .nm{font-size:12.5px}
.reply p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.reply-form{margin-left:30px;display:flex;flex-direction:column;gap:6px}
.reply-form textarea{min-height:52px}
.reply-form .row{display:flex;gap:6px;justify-content:flex-end}
.empty-notes{padding:28px 18px;color:var(--muted);text-align:center}
.empty-notes strong{display:block;color:var(--text);margin-bottom:4px}
.card{margin:4px 8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);display:flex;flex-direction:column;gap:6px;font-size:13px}
.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.card .lead{color:var(--muted);font-size:12px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ticks li.on .t{color:var(--muted);text-decoration:line-through}
.ticks .jump{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:transparent;border:0;padding:0 2px}
.qc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.qc li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.qc .d{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.notes-foot{padding:8px 16px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{margin:10px 16px 0;padding:8px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--danger) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);font-size:12.5px}
.narrow-only{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ground);padding:8px 14px;border-radius:var(--r);font-weight:500;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:899px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .library{display:none}
  .stage-head,.transport{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage-head{flex-wrap:wrap}
  .stage-title{flex-basis:100%}
  .cut-picker{display:block;width:100%;order:9}
  .seg.on{display:flex}
  .player-wrap{padding:12px 16px}
  .player-wrap.compare .frame.hide{display:none}
  .notes{border-left:0;border-top:1px solid var(--line);padding-right:0}
  .verbar,.composer,.notes-head,.notes-foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .round,.banner{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
  .note-list{overflow:visible;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .keys{display:none}
  .narrow-only{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="library" aria-label="Cuts">
    <div class="brand"><b>__PROJECT_HTML__</b><span>Cut Review</span></div>
    <div id="cutList"></div>
    <div class="lib-actions">
      <button class="btn" id="addCutBtn" type="button" hidden>+ Add a cut</button>
      <form class="upload" id="uploadForm" hidden>
        <label>Video file (MP4 or WebM, up to 20 MB)
          <input class="field" type="file" id="upFile" accept="video/mp4,video/webm" required>
        </label>
        <label>Video name
          <input class="field" id="upGroup" list="groupNames" placeholder="Launch film" required>
          <datalist id="groupNames"></datalist>
        </label>
        <div class="row">
          <label>Cut and version
            <input class="field" id="upLabel" placeholder="Main v1" required>
          </label>
          <label>Frame rate
            <select class="field" id="upFps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select>
          </label>
        </div>
        <div class="row">
          <button class="btn ghost" type="button" id="upCancel">Cancel</button>
          <button class="btn primary" type="submit" id="upSubmit">Upload</button>
        </div>
        <div class="status" id="upStatus" role="status"></div>
      </form>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <div class="stage-title">
        <div class="g" id="curGroup">Loading</div>
        <h1 id="curLabel">Fetching cuts</h1>
      </div>
      <span class="chip" id="stateChip" hidden></span>
      <div class="seg" id="abSeg" role="group" aria-label="Which version is showing"></div>

<script>
(() => {

let db = null, user = null, assets = null, comments = null;

/* ---------- helpers ---------- */

const cur = () => S.vmap.get(S.currentId) || null;
const fpsOf = v => (v && v.fps) || 30;
const fps = () => fpsOf(cur());
const dur = () => (isFinite(video.duration) && video.duration > 0) ? video.duration : ((cur() && cur().duration) || 0);

const nowIso = () => new Date().toISOString();
let toastTimer;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms || 3600); }
function banner(msg) { const s = $('#bannerSlot'); s.replaceChildren(); if (msg) s.append(h('div', { class: 'banner', role: 'status', text: msg })); }
function personName(id) {

  if (id === 'chat' || !id) return 'You';
  const p = S.profiles[id]; return (p && p.name) || (id === S.me.id ? 'You' : 'Someone');
}
function avatar(id) {

function writeErr(e) {

function legacyCopy(text) {

}
const tick1 = () => { const b = document.createElement('span'); b.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>'; return b.firstChild; };

/* ---------- versions: a video (group) has cuts (variants), and each cut has versions ---------- */
function vinfo(v) {

  if (variant == null || version == null) {
    const m = /^(.*?)[\s,_-]*\bv(\d+)\s*$/i.exec(v.label || '');
    if (variant == null) variant = m ? (m[1].trim() || 'Main') : (v.label || 'Main');
    if (version == null) version = m ? parseInt(m[2], 10) : 1;

}
const gname = v => (v && v.group) || 'Ungrouped';
const sameGroup = v => S.videos.filter(x => gname(x) === gname(v));
function versionsOf(v) {
  const k = vinfo(v).variant;
  return sameGroup(v).filter(x => vinfo(x).variant === k).sort((a, b) => vinfo(a).version - vinfo(b).version || String(a.createdAt).localeCompare(String(b.createdAt)));
}
function prevOf(v) { const vs = versionsOf(v), i = vs.findIndex(x => x.id === v.id); return i > 0 ? vs[i - 1] : null; }

const isLatest = v => latestOf(v).id === v.id;
const siblingNames = v => [...new Set(sameGroup(v).map(x => vinfo(x).variant))];
const nameOf = v => v ? (v.label || 'Untitled') : '';

/* ---------- note states ----------
   open      nobody has dealt with it
   addressed Claude replied with kind "done" or "partly" and named the version it was fixed in
   done      the reviewer ticked it (or approved the version)                                   */
function reindex() {
  S.vmap = new Map(S.videos.map(v => [v.id, v]));
  S.kids = new Map(); S.tops = [];
  for (const c of S.comments) {
    if (c.parentId) { if (!S.kids.has(c.parentId)) S.kids.set(c.parentId, []); S.kids.get(c.parentId).push(c); }
    else S.tops.push(c);
  }
  for (const list of S.kids.values()) list.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
}
const repliesOf = id => S.kids.get(id) || [];
const isWhole = c => c.general === true || c.t == null;
function fixOf(c) { const m = repliesOf(c.id).filter(r => r.author === 'claude' && (r.kind === 'done' || r.kind === 'partly') && r.addressedIn); return m.length ? m[m.length - 1] : null; }
function triageOf(c) { const m = repliesOf(c.id).filter(r => r.author === 'claude' && r.kind && !r.addressedIn); return m.length ? m[m.length - 1] : null; }
/* Where to look, in the cut on screen, for a change. The time Claude gave is exact in the version it
   was made in; in a later version or a sibling cut it is scaled by length, so it is only close. */
function fixTime(c, v) {
  const f = fixOf(c); if (!f || f.addressedAt == null || !v) return null;
  const fv = S.vmap.get(f.addressedIn);
  if (!fv || fv.id === v.id) return { t: f.addressedAt, exact: true };
  const k = (v.duration && fv.duration) ? v.duration / fv.duration : 1;
  return { t: Math.min(f.addressedAt * k, Math.max(0, (v.duration || 0) - 0.1)), exact: false };
}
const stateOf = c => c.resolved ? 'done' : fixOf(c) ? 'addressed' : 'open';
function noteSort(a, b) { return (isWhole(b) - isWhole(a)) || ((a.t || 0) - (b.t || 0)) || String(a.createdAt).localeCompare(String(b.createdAt)); }
const topsFor = vid => S.tops.filter(c => c.videoId === vid).sort(noteSort);
function numbersFor(vid) {
  const m = new Map(); let w = 0, n = 0;
  for (const c of topsFor(vid)) m.set(c.id, isWhole(c) ? 'W' + (++w) : '#' + (++n));
  return m;
}
/* A note left on another cut of the same video also applies here when it is on an earlier version of
   this cut, or on a sibling cut (unless the reviewer ticked "this cut only"). */
function appliesTo(c, v) {
  const cv = S.vmap.get(c.videoId); if (!cv || cv.id === v.id || gname(cv) !== gname(v)) return false;
  const a = vinfo(cv), b = vinfo(v);

}
function earlierFor(v) {

    const va = S.vmap.get(a.videoId), vb = S.vmap.get(b.videoId);

}
const openOn = v => topsFor(v.id).filter(c => stateOf(c) === 'open').concat(earlierFor(v).filter(c => stateOf(c) === 'open'));
const toTickOn = v => earlierFor(v).filter(c => stateOf(c) === 'addressed');

  return S.rounds.filter(r => r.group === g && !['done', 'withdrawn'].includes(r.state)).sort((a, b) => String(b.submittedAt).localeCompare(String(a.submittedAt)))[0] || null;

const checksFor = vid => S.checks.filter(k => k.videoId === vid).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.createdAt).localeCompare(String(b.createdAt)));

/* ---------- layout ---------- */
function arOf(el, v) { return (el.videoWidth && el.videoHeight) ? el.videoWidth / el.videoHeight : (v && v.w && v.h ? v.w / v.h : 9 / 16); }

/* ---------- ink ---------- */

/* ---------- seeking ----------

   time on every pointer move, and each request cancels the one before it, so the picture would sit

function makeSeeker(el) {

  const go = () => { if (want == null) return; const t = want; want = null; shown = t; try { el.currentTime = t; } catch (e) { /* not ready yet */ } };
  el.addEventListener('seeked', () => { shown = null; go(); });

  return seek;

const seekA = makeSeeker(video), seekB = makeSeeker(videoB);
const nowT = () => seekA.target();

/* ---------- player ---------- */
function setPlayIcon() {
  $('#playIcon').innerHTML = video.paused ? '<path d="M7 4.5v15l12.5-7.5z"/>' : '<path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/>';

  else { video.pause(); videoB.pause(); }
}
function seek(t, keepInk) {

}
function step(dir) {

}

let lastActive = null;
function tick() {

  $('#prog').style.width = pct + '%';
  $('#playhead').style.left = pct + '%';
  $('#curTime').textContent = tc(t);
  if (video.buffered.length && d) $('#buf').style.width = Math.min(100, video.buffered.end(video.buffered.length - 1) / d * 100) + '%';
  updatePill();
  if (S.compare) tickB();
  let act = null;
  if (S.tab === 'notes') for (const c of shownNotes()) { if (isWhole(c)) continue; const end = c.tEnd != null ? c.tEnd : c.t + 1.5; if (t >= c.t - 0.02 && t <= end) act = c.id; }

function toggleWhole() { if (!S.canWrite || !cur()) return; S.whole = !S.whole; if (S.whole) { S.penOn = false; } renderComposer(); drawInk(); if (S.whole) $('#noteText').focus(); }
function togglePen() { if (!S.canWrite || !cur() || S.whole) return; S.penOn = !S.penOn; if (S.penOn) { video.pause(); S.showInkFor = null; if (S.compare && S.showB) { S.showB = false; renderCompare(); fitFrame(); } } renderComposer(); drawInk(); }
function setIn() { if (!cur() || S.whole) return; video.pause(); S.rangeIn = nowT(); if (S.rangeOut != null && S.rangeOut <= S.rangeIn) S.rangeOut = null; renderComposer(); }
function setOut() {
  if (!cur() || S.whole) return; video.pause();
  if (S.rangeIn == null || nowT() <= S.rangeIn) { toast('Set an in point first (I), then move forward and press Out.'); return; }
  S.rangeOut = nowT(); renderComposer();
}
function clearRange() { S.rangeIn = S.rangeOut = null; renderComposer(); }
let posting = false;
async function post() {
  const ta = $('#noteText'), text = ta.value.trim(), v = cur();
  if (!v || !db || !S.canWrite || posting) return;   // `posting` stops Enter and the button, or a double Enter, saving the note twice
  const strokes = S.whole ? [] : S.strokes;
  if (!text && !strokes.length) { ta.focus(); toast(S.whole ? 'Type the note first.' : 'Type a note or draw on the frame first.'); return; }
  const t = S.whole ? null : (S.rangeIn != null ? S.rangeIn : nowT());
  const tEnd = !S.whole && S.rangeIn != null && S.rangeOut != null && S.rangeOut > S.rangeIn ? S.rangeOut : null;
  const r3 = x => x == null ? null : Math.round(x * 1000) / 1000;
  const doc = { videoId: v.id, t: r3(t), tEnd: r3(tEnd), general: S.whole, variantOnly: !$('#onlyWrap').hidden && $('#onlyBox').checked, parentId: null, text, author: S.me.id, createdAt: nowIso(), resolved: false, strokes: strokes.length ? strokes : null };
  posting = true; $('#postBtn').disabled = true;
  try {
    await db.collection('comments').add(doc);
    ta.value = ''; S.strokes = []; S.penOn = false; S.rangeIn = S.rangeOut = null; S.whole = false; $('#onlyBox').checked = false;
    S.tab = 'notes'; if (S.filter !== 'all') S.filter = 'open';
    drawInk(); renderComposer(); renderNotes(); toast(t == null ? 'Whole-video note posted' : 'Note posted at ' + tc(t));
  } catch (e) { writeErr(e); }
  finally { posting = false; $('#postBtn').disabled = !S.canWrite; }
}
function focusComposer() { if (!S.canWrite) return; video.pause(); $('#noteText').focus(); }
$('#noteText').addEventListener('focus', () => { video.pause(); videoB.pause(); });
$('#noteText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!e.repeat) post(); } });
$('#postBtn').addEventListener('click', post);
$('#wholeBtn').addEventListener('click', toggleWhole);
$('#penBtn').addEventListener('click', togglePen);
$('#clearInkBtn').addEventListener('click', () => { S.strokes = []; drawInk(); renderComposer(); });
$('#inBtn').addEventListener('click', setIn);
$('#outBtn').addEventListener('click', setOut);
$('#clearRangeBtn').addEventListener('click', clearRange);
$('#notePill').addEventListener('click', () => { if (S.rangeIn != null && !S.whole) seek(S.rangeIn); });
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; renderNotes(); tick(); }));
$('#filter').addEventListener('change', e => { S.filter = e.target.value; renderNotes(); tick(); });

/* copy edit list: every open note that applies to the cut on screen, as plain text for a chat or an email */
$('#copyBtn').addEventListener('click', () => {
  const v = cur(); if (!v) return;
  const own = topsFor(v.id).filter(c => stateOf(c) === 'open'), other = earlierFor(v).filter(c => stateOf(c) === 'open');
  const lines = [(v.group ? v.group + ', ' : '') + nameOf(v), 'Open notes (' + (own.length + other.length) + ')', ''];
  const line = (c, n, where) => {
    const f = fpsOf(S.vmap.get(c.videoId));
    lines.push(n + '  ' + (isWhole(c) ? 'Whole video' : c.tEnd != null ? tcAt(c.t, f) + ' to ' + tcAt(c.tEnd, f) : tcAt(c.t, f)) + (where ? ' on ' + where : '') + '  ' + (c.text || '(drawing only)') + (c.strokes && c.strokes.length ? ' [drawing on frame]' : '') + '  (' + personName(c.author) + ')');
    for (const r of repliesOf(c.id)) lines.push('      reply from ' + personName(r.author) + ': ' + r.text);
  };
  const nums = numbersFor(v.id); for (const c of own) line(c, nums.get(c.id));
  for (const c of other) line(c, numbersFor(c.videoId).get(c.id), nameOf(S.vmap.get(c.videoId)));
  copyText(lines.join('\n'), 'Edit list copied (' + (own.length + other.length) + ' notes)');
});

/* keyboard */
document.addEventListener('keydown', e => {
  const t = e.target, typing = t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable;
  if (typing) { if (e.key === 'Escape') t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' && t.tagName === 'BUTTON') return;
  switch (e.key) {
    case ' ': case 'k': case 'K': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); e.shiftKey ? nudge(-1) : step(-1); break;
    case 'ArrowRight': e.preventDefault(); e.shiftKey ? nudge(1) : step(1); break;
    case 'c': case 'C': e.preventDefault(); focusComposer(); break;
    case 'w': case 'W': e.preventDefault(); toggleWhole(); break;
    case 'v': case 'V': setCompare(!S.compare); break;
    case 'i': case 'I': setIn(); break;
    case 'o': case 'O': setOut(); break;
    case 'x': case 'X': clearRange(); break;
    case 'd': case 'D': togglePen(); break;
    case 'Escape': if (S.penOn) togglePen(); else { S.selectedId = null; S.showInkFor = null; drawInk(); renderNotes(); } break;
  }
});

/* ---------- upload ---------- */
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'cut'; }
function probe(file) {
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(file);
    const done = r => { URL.revokeObjectURL(url); res(r); };
    v.preload = 'metadata'; v.muted = true;
    v.onloadedmetadata = () => done({ duration: v.duration, w: v.videoWidth, h: v.videoHeight });
    v.onerror = () => done(null);
    setTimeout(() => done(null), 10000);
    v.src = url;
  });
}
$('#addCutBtn').addEventListener('click', () => { $('#uploadForm').hidden = false; $('#addCutBtn').hidden = true; const v = cur(); if (v && !$('#upGroup').value) $('#upGroup').value = v.group || ''; });
$('#upCancel').addEventListener('click', () => { $('#uploadForm').hidden = true; $('#addCutBtn').hidden = false; $('#upStatus').textContent = ''; });
$('#uploadForm').addEventListener('submit', async e => {
  e.preventDefault();
  const st = $('#upStatus'); st.className = 'status';
  const file = $('#upFile').files[0], group = $('#upGroup').value.trim(), label = $('#upLabel').value.trim(), f = parseInt($('#upFps').value, 10);
  if (!file || !group || !label) return;
  const type = file.type === 'video/webm' ? 'video/webm' : (file.type === 'video/mp4' || /\.mp4$/i.test(file.name) ? 'video/mp4' : '');
  if (!type) { st.className = 'status err'; st.textContent = 'Use an MP4 or WebM file. Export a .mov as MP4 (H.264) first.'; return; }
  if (file.size > MAX_UPLOAD) { st.className = 'status err'; st.textContent = 'This file is ' + (file.size / 1048576).toFixed(1) + ' MB and the limit is 20 MB. Export a review copy at 720p, about 1 Mbps, or ask Claude to compress it.'; return; }
  $('#upSubmit').disabled = true; st.textContent = 'Reading the file…';
  const meta = await probe(file);
  st.textContent = 'Uploading ' + (file.size / 1048576).toFixed(1) + ' MB…';
  try {
    const res = await assets.upload(file, { type });
    const id = slug(group + '-' + label) + '-' + Math.random().toString(36).slice(2, 6);
    const info = vinfo({ label });
    await db.doc('videos/' + id).set({ group, label, variant: info.variant, version: info.version, status: 'review', assetId: res.id, duration: meta ? Math.round(meta.duration * 1000) / 1000 : 0, w: meta ? meta.w : 720, h: meta ? meta.h : 1280, fps: f, createdAt: nowIso(), createdBy: S.me.id });
    st.textContent = 'Uploaded.'; $('#uploadForm').reset(); $('#uploadForm').hidden = true; $('#addCutBtn').hidden = false;
    go(id);
  } catch (err) {
    st.className = 'status err';
    st.textContent = err && err.code === 'too_large' ? 'Over the 20 MB limit. Export a smaller review copy.'
      : err && err.code === 'unsupported_type' ? 'That format is not accepted. Use MP4 (H.264) or WebM.'
      : err && err.code === 'quota_or_state' ? 'Storage for this page is full. Remove an old version first.'
      : err && err.code === 'invalid_argument' ? 'You do not have permission to add cuts here.'
      : 'Upload failed. Try again in a moment.';
  } finally { $('#upSubmit').disabled = false; }
});

/* ---------- boot ---------- */
async function boot() {
  setPlayIcon(); fitFrame(); renderComposer(); renderNotes();
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  [db, user, assets, comments] = await Promise.all([use('db'), use('user'), use('assets'), use('comments')]);
  if (user) {
    const me = await user.me();
    S.me = { id: me.id, isOwner: me.isOwner, canEdit: me.canEdit };
    const cw = await user.can('data.write');
    S.canWrite = cw !== false && !!me.id;
  }
  if (assets) $('#addCutBtn').hidden = false;
  if (!db) {
    S.dbState = 'none'; S.canWrite = false;
    showStage('Sign in to see the cuts', 'This review page keeps its videos and notes in claude.ai. Open it while signed in.');
    renderComposer(); renderNotes(); return;
  }
  renderComposer();
  let confirmed = false;
  const timer = setTimeout(() => { if (!confirmed) banner('Cannot reach the saved cuts and notes yet. The page keeps trying; check your connection.'); }, 10000);
  const rows = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  db.collection('videos').onSnapshot(snap => {
    S.videos = rows(snap); reindex();
    if (!snap.metadata.fromCache) { confirmed = true; clearTimeout(timer); banner(null); S.dbState = 'ready'; }
    ensureCurrent(); renderNotes(); renderComposer(); refreshProfiles();
  }, () => { clearTimeout(timer); S.dbState = 'error'; banner('The saved cuts could not be loaded. Reload the page to try again.'); renderLibrary(); });
  let firstNotes = true;
  db.collection('comments').onSnapshot(snap => {
    S.comments = rows(snap); reindex();
    if (S.selectedId && !S.comments.some(c => c.id === S.selectedId)) { S.selectedId = null; S.showInkFor = null; drawInk(); }
    if (firstNotes && !snap.metadata.fromCache) { firstNotes = false; const v = cur(); if (v && toTickOn(v).length) S.tab = 'changes'; }
    renderNotes(); tick(); refreshProfiles();
  }, () => { banner('Notes could not be loaded. Reload the page to try again.'); });
  db.collection('rounds').onSnapshot(snap => { S.rounds = rows(snap); renderVerbar(); renderRound(); }, () => {});
  let firstChecks = true;
  db.collection('checks').onSnapshot(snap => {
    S.checks = rows(snap);
    if (firstChecks && !snap.metadata.fromCache) { firstChecks = false; const v = cur(); if (v && checksFor(v.id).some(k => !k.done)) S.tab = 'changes'; }
    renderNotes();
  }, () => {});
}
let profileKey = '';
async function refreshProfiles() {
  if (!user) return;
  const ids = [...new Set(S.comments.map(c => c.author).concat(S.videos.map(v => v.createdBy)).filter(x => x && x !== 'claude' && x !== 'chat'))];
  if (!ids.length) return;
  S.profiles = await user.profiles(ids);
  const key = ids.map(i => i + ':' + ((S.profiles[i] && S.profiles[i].name) || '')).join('|');
  if (key !== profileKey) { profileKey = key; renderNotes(); }
}
boot();
})();
</script>
